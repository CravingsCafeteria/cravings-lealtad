<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F57E2F" />
  <title>Nueva contraseña | Cravings!</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <main class="shell narrow">

    <header class="brandbar">
      <a class="brand" href="./">
        <span class="logo-wrap">
          <img src="assets/logo-cravings-square.png" alt="Cravings!" />
        </span>

        <span>
          <span class="brand-name">Cravings!</span>
          <span class="brand-sub">Tarjeta de lealtad</span>
        </span>
      </a>
    </header>

    <div class="card hero">
      <div class="eyebrow">Recuperación de cuenta</div>
      <h1>Crea una nueva contraseña</h1>
      <p class="lead">
        Escribe tu nueva contraseña para volver a acceder a tu Tarjeta Cravings!
      </p>
    </div>

    <div class="card">

      <div id="recoveryMessage"></div>

      <form id="resetPasswordForm" class="form-grid">

        <label>Nueva contraseña
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
            placeholder="Mínimo 6 caracteres"
          />
        </label>

        <label>Confirma tu nueva contraseña
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
            placeholder="Escríbela nuevamente"
          />
        </label>

        <button
          id="savePasswordBtn"
          class="btn btn-primary btn-block"
          type="submit"
        >
          Guardar nueva contraseña
        </button>

      </form>

      <p class="muted small center" style="margin-top:16px;">
        Tu tarjeta, sellos y recompensas permanecerán sin cambios.
      </p>

    </div>

    <footer>Cravings! · Programa de lealtad</footer>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>

  <script>
    const db = window.cravingsDb;
    const form = document.getElementById('resetPasswordForm');
    const message = document.getElementById('recoveryMessage');
    const button = document.getElementById('savePasswordBtn');

    function showMessage(text, type = 'info') {
      message.innerHTML =
        `<div class="notice ${type}">${text}</div>`;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (!db) {
        showMessage(
          'No fue posible conectar con el sistema. Intenta nuevamente.',
          'error'
        );
        return;
      }

      const password =
        document.getElementById('newPassword').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showMessage(
          'Las contraseñas no coinciden.',
          'error'
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          'La contraseña debe tener al menos 6 caracteres.',
          'error'
        );
        return;
      }

      button.disabled = true;
      showMessage('Guardando tu nueva contraseña…', 'info');

      const { data: sessionData } =
        await db.auth.getSession();

      if (!sessionData.session) {
        button.disabled = false;

        showMessage(
          'Este enlace de recuperación ya no es válido o ha expirado. Solicita uno nuevo desde la página de Cravings!',
          'error'
        );

        return;
      }

      const { error } =
        await db.auth.updateUser({
          password: password
        });

      if (error) {
        button.disabled = false;

        showMessage(
          'No pudimos cambiar tu contraseña. Intenta solicitar un nuevo enlace.',
          'error'
        );

        return;
      }

      await db.auth.signOut();

      form.classList.add('hidden');

      showMessage(
        '¡Contraseña actualizada! Ya puedes volver a entrar a tu Tarjeta Cravings! <br><br><a class="btn btn-dark" href="./">Volver a mi tarjeta</a>',
        'success'
      );
    });
  </script>

</body>
</html>
